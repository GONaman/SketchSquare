name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sketch
          POSTGRES_PASSWORD: sketch
          POSTGRES_DB: sketchsquare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sketch" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sketch:sketch@localhost:5432/sketchsquare_test
      TEST_DATABASE_URL: postgresql://sketch:sketch@localhost:5432/sketchsquare_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MinIO and create buckets
        working-directory: .
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait minio
          docker compose -f infra/docker-compose.yml run --rm minio-init
      - run: npm ci
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:e2e

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sketch_square
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
