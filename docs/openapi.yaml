openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: ok
                  checks:
                    db: up
                    redis: up
                    s3: up
      summary: Liveness + dependency check (DB, Redis, S3)
      tags:
        - ops
  /cart:
    get:
      operationId: CartController_get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: &a1
        - bearer: []
      tags: &a2
        - cart
    post:
      operationId: CartController_add
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: *a1
      tags: *a2
  /cart/{drawingId}:
    delete:
      operationId: CartController_remove
      parameters:
        - name: drawingId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: *a1
      tags: *a2
  /checkout:
    post:
      operationId: CheckoutController_create
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: &a3
        - bearer: []
      tags: &a4
        - checkout
  /checkout/verify:
    post:
      operationId: CheckoutController_verify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentDto"
      responses:
        "200":
          description: ""
      security: *a3
      tags: *a4
  /checkout/stub-complete:
    post:
      operationId: CheckoutController_stubComplete
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StubCompleteDto"
      responses:
        "200":
          description: ""
      security: *a3
      tags: *a4
  /checkout/status:
    get:
      operationId: CheckoutController_status
      parameters: []
      responses:
        "200":
          description: ""
      security: *a3
      tags: *a4
  /payments/razorpay/webhook:
    post:
      operationId: RazorpayWebhookController_webhook
      parameters:
        - name: x-razorpay-signature
          required: true
          in: header
          schema:
            type: string
        - name: x-razorpay-event-id
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: Signature-verified (HMAC over the raw body) and idempotent by `x-razorpay-event-id`.
      tags:
        - payments
  /drawings/{id}/download:
    get:
      operationId: DownloadsController_download
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: sheetId
          required: false
          in: query
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
      tags:
        - downloads
  /me/purchases:
    get:
      operationId: LibraryController_purchases
      parameters:
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from a previous page
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 20
            type: number
      responses:
        "200":
          description: ""
      security:
        - bearer: []
      tags:
        - library
  /drawings/{id}/review:
    put:
      operationId: ReviewsController_put
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutReviewDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
      tags:
        - reviews
  /drawings:
    post:
      operationId: DrawingsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDrawingDto"
      responses:
        "201":
          description: ""
      security: &a5
        - bearer: []
      tags: &a6
        - drawings
  /drawings/{id}:
    patch:
      operationId: DrawingsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDrawingDto"
      responses:
        "200":
          description: ""
      security: *a5
      tags: *a6
    delete:
      operationId: DrawingsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      security: *a5
      tags: *a6
  /drawings/{id}/publish:
    post:
      operationId: DrawingsController_publish
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "202":
          description: ""
      security: *a5
      tags: *a6
  /drawings/{drawingId}/sheets/upload-url:
    post:
      operationId: SheetsController_uploadUrl
      parameters:
        - name: drawingId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlDto"
      responses:
        "200":
          description: ""
      security: &a7
        - bearer: []
      tags: &a8
        - drawings
  /drawings/{drawingId}/sheets:
    post:
      operationId: SheetsController_register
      parameters:
        - name: drawingId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSheetDto"
      responses:
        "201":
          description: ""
      security: *a7
      tags: *a8
  /drawings/{drawingId}/sheets/{sheetId}:
    patch:
      operationId: SheetsController_update
      parameters:
        - name: drawingId
          required: true
          in: path
          schema:
            type: string
        - name: sheetId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSheetDto"
      responses:
        "200":
          description: ""
      security: *a7
      tags: *a8
    delete:
      operationId: SheetsController_remove
      parameters:
        - name: drawingId
          required: true
          in: path
          schema:
            type: string
        - name: sheetId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      security: *a7
      tags: *a8
  /drawings/search:
    get:
      operationId: SearchController_searchDrawings
      parameters:
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from a previous page
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 20
            type: number
        - name: q
          required: false
          in: query
          description: Full-text query over title and description
          schema:
            maxLength: 100
            type: string
        - name: categoryId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: length
          required: false
          in: query
          description: Plot length in `unit`; must be sent together with `breadth`
          schema:
            minimum: 1
            maximum: 100000
            example: 30
            type: number
        - name: breadth
          required: false
          in: query
          description: Plot breadth in `unit`; must be sent together with `length`
          schema:
            minimum: 1
            maximum: 100000
            example: 40
            type: number
        - name: unit
          required: false
          in: query
          schema:
            default: ft
            type: string
            enum:
              - ft
              - m
        - name: tolerancePct
          required: false
          in: query
          description: Each dimension may differ by this percent; the rotated plot also matches
          schema:
            minimum: 0
            maximum: 50
            default: 10
            type: number
        - name: city
          required: false
          in: query
          description: Repeatable, case-insensitive
          schema:
            maxItems: 20
            maxLength: 80
            type: array
            items:
              type: string
        - name: minDrawingRating
          required: false
          in: query
          schema:
            minimum: 0
            maximum: 5
            type: number
        - name: minArchitectRating
          required: false
          in: query
          schema:
            minimum: 0
            maximum: 5
            type: number
        - name: priceType
          required: false
          in: query
          schema:
            default: all
            type: string
            enum:
              - free
              - paid
              - all
        - name: minPricePaise
          required: false
          in: query
          schema:
            minimum: 0
            type: number
        - name: maxPricePaise
          required: false
          in: query
          schema:
            minimum: 0
            type: number
        - name: floors
          required: false
          in: query
          description: Repeatable; number of floors
          schema:
            maxItems: 10
            type: array
            items:
              type: number
              maximum: 100
              minimum: 1
        - name: facing
          required: false
          in: query
          description: Repeatable
          schema:
            maxItems: 8
            type: array
            items:
              type: string
              enum:
                - N
                - NE
                - E
                - SE
                - S
                - SW
                - W
                - NW
        - name: architectId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: sort
          required: false
          in: query
          description: relevance ranks by text match and size match (newest when neither is given); size_match requires length+breadth
          schema:
            default: relevance
            type: string
            enum:
              - relevance
              - price_asc
              - price_desc
              - drawing_rating
              - architect_rating
              - newest
              - popularity
              - size_match
      responses:
        "200":
          description: ""
      security:
        - bearer: []
      summary: Search published drawings by text, plot size (with tolerance and rotation) and filters
      tags:
        - discovery
info:
  title: SketchSquare API
  description: "Contract: docs/API_CONTRACT.md"
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AddCartItemDto:
      type: object
      properties:
        drawingId:
          type: string
          format: uuid
      required:
        - drawingId
    VerifyPaymentDto:
      type: object
      properties:
        razorpayOrderId:
          type: string
          maxLength: 100
        razorpayPaymentId:
          type: string
          maxLength: 100
        razorpaySignature:
          type: string
          maxLength: 200
      required:
        - razorpayOrderId
        - razorpayPaymentId
        - razorpaySignature
    StubCompleteDto:
      type: object
      properties:
        orderId:
          type: string
          maxLength: 100
      required:
        - orderId
    PutReviewDto:
      type: object
      properties:
        comment:
          type: string
          nullable: true
          maxLength: 1000
        rating:
          type: number
          minimum: 1
          maximum: 5
      required:
        - rating
    CreateDrawingDto:
      type: object
      properties:
        plotLength:
          type: number
          maximum: 100000
          minimum: 1
          description: Plot length in `unit`
          example: 40
        pricePaise:
          type: number
          minimum: 0
          maximum: 100000000
          description: Integer paise. Required unless `isFree` is true.
        isFree:
          type: boolean
          description: Forces pricePaise = 0
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
        city:
          type: string
          minLength: 1
          maxLength: 80
        plotBreadth:
          type: number
          maximum: 100000
          minimum: 1
        unit:
          type: string
          enum: &a9
            - ft
            - m
        floors:
          type: number
          minimum: 1
          maximum: 100
        facing:
          type: string
          enum:
            - W
            - S
            - N
            - NE
            - E
            - SE
            - SW
            - NW
        bedrooms:
          type: number
          minimum: 0
          maximum: 20
        tags:
          maxItems: 8
          type: array
          items:
            type: string
            maxLength: 24
      required:
        - title
        - description
        - categoryId
        - city
        - plotBreadth
        - unit
        - floors
    UpdateDrawingDto:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
        city:
          type: string
          minLength: 1
          maxLength: 80
        plotLength:
          type: number
          maximum: 100000
          minimum: 1
        plotBreadth:
          type: number
          maximum: 100000
          minimum: 1
        unit:
          type: string
          enum: *a9
        floors:
          type: number
          minimum: 1
          maximum: 100
        facing:
          type: string
          enum:
            - W
            - S
            - N
            - NE
            - E
            - SE
            - SW
            - NW
        bedrooms:
          type: number
          minimum: 0
          maximum: 20
        tags:
          maxItems: 8
          type: array
          items:
            type: string
            maxLength: 24
        pricePaise:
          type: number
          minimum: 0
          maximum: 100000000
        isFree:
          type: boolean
    UploadUrlDto:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        contentType:
          type: string
          minLength: 1
          maxLength: 100
        sizeBytes:
          type: number
          minimum: 1
      required:
        - fileName
        - contentType
        - sizeBytes
    RegisterSheetDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - ARCHITECTURAL
            - STRUCTURAL
            - ELECTRICAL
            - SANITARY
            - PLUMBING
            - HVAC
            - OTHER
        objectKey:
          type: string
          minLength: 1
          maxLength: 400
        isPreview:
          type: boolean
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        sizeBytes:
          type: number
          minimum: 1
      required:
        - type
        - objectKey
        - isPreview
        - fileName
        - sizeBytes
    UpdateSheetDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - ARCHITECTURAL
            - STRUCTURAL
            - ELECTRICAL
            - SANITARY
            - PLUMBING
            - HVAC
            - OTHER
        isPreview:
          type: boolean
