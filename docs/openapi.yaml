info:
  title: SketchSquare API
  description: "Contract: docs/API_CONTRACT.md"
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SignupDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[0-9]{10,14}$
        address:
          type: string
          maxLength: 300
        city:
          type: string
          maxLength: 100
      required:
        - email
        - password
        - fullName
        - phone
        - address
        - city
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 512
      required:
        - refreshToken
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          maxLength: 512
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    AddCartItemDto:
      type: object
      properties:
        drawingId:
          type: string
          format: uuid
      required:
        - drawingId
    VerifyPaymentDto:
      type: object
      properties:
        razorpayOrderId:
          type: string
          maxLength: 100
        razorpayPaymentId:
          type: string
          maxLength: 100
        razorpaySignature:
          type: string
          maxLength: 200
      required:
        - razorpayOrderId
        - razorpayPaymentId
        - razorpaySignature
    StubCompleteDto:
      type: object
      properties:
        orderId:
          type: string
          maxLength: 100
      required:
        - orderId
    PutReviewDto:
      type: object
      properties:
        comment:
          type: string
          nullable: true
          maxLength: 1000
        rating:
          type: number
          minimum: 1
          maximum: 5
      required:
        - rating
    BankAccountDto:
      type: object
      properties:
        holderName:
          type: string
          minLength: 2
          maxLength: 100
        ifsc:
          type: string
          pattern: ^[A-Z]{4}0[A-Z0-9]{6}$
        accountNumber:
          type: string
          pattern: ^\d{9,18}$
      required:
        - holderName
        - ifsc
        - accountNumber
    CreateWithdrawalDto:
      type: object
      properties:
        amountPaise:
          type: number
          minimum: 1
          maximum: 2000000000
      required:
        - amountPaise
    UpdateProfileDto:
      type: object
      properties:
        phone:
          type: string
          pattern: ^\+?[0-9]{10,14}$
        city:
          type: string
          maxLength: 100
    AvatarUploadUrlDto:
      type: object
      properties:
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
      required:
        - contentType
    AvatarConfirmDto:
      type: object
      properties:
        objectKey:
          type: string
          maxLength: 200
      required:
        - objectKey
    CreateDrawingDto:
      type: object
      properties:
        plotLength:
          type: number
          maximum: 100000
          minimum: 1
          description: Plot length in `unit`
          example: 40
        pricePaise:
          type: number
          minimum: 0
          maximum: 100000000
          description: Integer paise. Required unless `isFree` is true.
        isFree:
          type: boolean
          description: Forces pricePaise = 0
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
        city:
          type: string
          minLength: 1
          maxLength: 80
        plotBreadth:
          type: number
          maximum: 100000
          minimum: 1
        unit:
          type: string
          enum: &a36
            - ft
            - m
        floors:
          type: number
          minimum: 1
          maximum: 100
        facing:
          type: string
          enum:
            - W
            - S
            - N
            - NE
            - E
            - SE
            - SW
            - NW
        bedrooms:
          type: number
          minimum: 0
          maximum: 20
        tags:
          maxItems: 8
          type: array
          items:
            type: string
            maxLength: 24
      required:
        - title
        - description
        - categoryId
        - city
        - plotBreadth
        - unit
        - floors
    UpdateDrawingDto:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
        city:
          type: string
          minLength: 1
          maxLength: 80
        plotLength:
          type: number
          maximum: 100000
          minimum: 1
        plotBreadth:
          type: number
          maximum: 100000
          minimum: 1
        unit:
          type: string
          enum: *a36
        floors:
          type: number
          minimum: 1
          maximum: 100
        facing:
          type: string
          enum:
            - W
            - S
            - N
            - NE
            - E
            - SE
            - SW
            - NW
        bedrooms:
          type: number
          minimum: 0
          maximum: 20
        tags:
          maxItems: 8
          type: array
          items:
            type: string
            maxLength: 24
        pricePaise:
          type: number
          minimum: 0
          maximum: 100000000
        isFree:
          type: boolean
    UploadUrlDto:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        contentType:
          type: string
          minLength: 1
          maxLength: 100
        sizeBytes:
          type: number
          minimum: 1
      required:
        - fileName
        - contentType
        - sizeBytes
    RegisterSheetDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - ARCHITECTURAL
            - STRUCTURAL
            - ELECTRICAL
            - SANITARY
            - PLUMBING
            - HVAC
            - OTHER
        objectKey:
          type: string
          minLength: 1
          maxLength: 400
        isPreview:
          type: boolean
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        sizeBytes:
          type: number
          minimum: 1
      required:
        - type
        - objectKey
        - isPreview
        - fileName
        - sizeBytes
    UpdateSheetDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - ARCHITECTURAL
            - STRUCTURAL
            - ELECTRICAL
            - SANITARY
            - PLUMBING
            - HVAC
            - OTHER
        isPreview:
          type: boolean
    RejectPlagiarismFlagDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
        - reason
    CreateCategoryRequestDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
      required:
        - name
    RejectVerificationDto:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
      required:
        - note
    RefundPurchaseDto:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required:
        - reason
    RegisterDeviceTokenDto:
      type: object
      properties:
        token:
          type: string
          minLength: 10
          maxLength: 4096
          description: FCM registration token
        platform:
          enum:
            - android
            - ios
            - web
          type: string
      required:
        - token
        - platform
    RemoveDeviceTokenDto:
      type: object
      properties:
        token:
          type: string
          minLength: 10
          maxLength: 4096
      required:
        - token
    MarkReadDto:
      type: object
      properties:
        ids:
          maxItems: 100
          description: Notification ids to mark as read; omit to mark all as read
          type: array
          items:
            type: string
            format: uuid
