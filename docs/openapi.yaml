openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  status: ok
                  checks:
                    db: up
                    redis: up
                    s3: up
      summary: Liveness + dependency check (DB, Redis, S3)
      tags:
        - ops
  /auth/signup:
    post:
      operationId: AuthController_signup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupDto"
      responses:
        "201":
          description: ""
      tags: &a1
        - auth
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: ""
      tags: *a1
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshDto"
      responses:
        "200":
          description: ""
      tags: *a1
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshDto"
      responses:
        "204":
          description: ""
      tags: *a1
  /auth/forgot-password:
    post:
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
      responses:
        "204":
          description: ""
      tags: *a1
  /auth/reset-password:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
      responses:
        "204":
          description: ""
      tags: *a1
  /cart:
    get:
      operationId: CartController_get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: &a2
        - bearer: []
      tags: &a3
        - cart
    post:
      operationId: CartController_add
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: *a2
      tags: *a3
  /cart/{drawingId}:
    delete:
      operationId: CartController_remove
      parameters:
        - name: drawingId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: *a2
      tags: *a3
  /checkout:
    post:
      operationId: CheckoutController_create
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: &a4
        - bearer: []
      tags: &a5
        - checkout
  /checkout/verify:
    post:
      operationId: CheckoutController_verify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentDto"
      responses:
        "200":
          description: ""
      security: *a4
      tags: *a5
  /checkout/stub-complete:
    post:
      operationId: CheckoutController_stubComplete
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StubCompleteDto"
      responses:
        "200":
          description: ""
      security: *a4
      tags: *a5
  /checkout/status:
    get:
      operationId: CheckoutController_status
      parameters: []
      responses:
        "200":
          description: ""
      security: *a4
      tags: *a5
  /payments/razorpay/webhook:
    post:
      operationId: RazorpayWebhookController_webhook
      parameters:
        - name: x-razorpay-signature
          required: true
          in: header
          schema:
            type: string
        - name: x-razorpay-event-id
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: Signature-verified (HMAC over the raw body) and idempotent by `x-razorpay-event-id`.
      tags:
        - payments
info:
  title: SketchSquare API
  description: "Contract: docs/API_CONTRACT.md"
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SignupDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[0-9]{10,14}$
        address:
          type: string
          maxLength: 300
        city:
          type: string
          maxLength: 100
      required:
        - email
        - password
        - fullName
        - phone
        - address
        - city
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 512
      required:
        - refreshToken
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          maxLength: 512
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    AddCartItemDto:
      type: object
      properties:
        drawingId:
          type: string
          format: uuid
      required:
        - drawingId
    VerifyPaymentDto:
      type: object
      properties:
        razorpayOrderId:
          type: string
          maxLength: 100
        razorpayPaymentId:
          type: string
          maxLength: 100
        razorpaySignature:
          type: string
          maxLength: 200
      required:
        - razorpayOrderId
        - razorpayPaymentId
        - razorpaySignature
    StubCompleteDto:
      type: object
      properties:
        orderId:
          type: string
          maxLength: 100
      required:
        - orderId
